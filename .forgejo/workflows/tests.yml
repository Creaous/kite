name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: docker
    timeout-minutes: 15
    container:
      image: node:22-bookworm
      options: --security-opt=no-new-privileges:true
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node and pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Drizzle migrations are up to date
        working-directory: apps/kite
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/kite_ci
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "Drizzle migrations are out of date. Run 'pnpm --filter kite run db:generate' and commit the changes." >&2
            echo
            git status --short -- drizzle
            git --no-pager diff -- drizzle || true
            exit 1
          fi

      - name: Lint workspace (also builds emails)
        run: pnpm lint

      - name: Run unit tests
        run: pnpm --filter kite run test:unit -- --run
