name: Release

on:
  push:
    branches:
      - develop
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: docker
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    container:
      image: docker:24-cli
      options: --security-opt=no-new-privileges:true
    env:
      IMAGE_REPOSITORY: ${{ vars.CONTAINER_IMAGE_REPOSITORY }}
      REGISTRY_HOST: ${{ vars.CONTAINER_REGISTRY_HOST }}
      NIGHTLY_GIT_TAG: ${{ vars.NIGHTLY_GIT_TAG || 'nightly' }}
      DOCKER_HOST: tcp://172.17.0.1:2375
    steps:
      - name: Install release dependencies
        shell: sh
        run: |
          set -eu
          apk add --no-cache bash git curl jq

      - name: Checkout source
        shell: bash
        run: |
          set -euo pipefail

          workspace="${GITHUB_WORKSPACE:-$PWD}"
          mkdir -p "$workspace"
          cd "$workspace"

          if [ ! -d .git ]; then
            git init
            git remote add origin "${GITHUB_SERVER_URL%/}/${GITHUB_REPOSITORY}.git"
          fi

          if [ -n "${GITHUB_TOKEN:-}" ]; then
            auth_header=( -c "http.extraHeader=Authorization: token ${GITHUB_TOKEN}" )
          else
            auth_header=()
          fi

          git "${auth_header[@]}" fetch --force --prune --tags origin
          sha="${GITHUB_SHA}"
          git checkout -f "${sha}"
          git clean -fd

      - name: Wait for Tests workflow on this commit
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail

          api_url="${FORGEJO_API_URL:-${GITHUB_API_URL:-${GITHUB_SERVER_URL%/}/api/v1}}"
          token="${RELEASE_TOKEN:-${GITHUB_TOKEN:-}}"
          if [ -z "$token" ]; then
            echo "No API token available. Set RELEASE_TOKEN or ensure GITHUB_TOKEN is present." >&2
            exit 1
          fi

          repo="${GITHUB_REPOSITORY}"
          sha="${GITHUB_SHA}"
          ref_name="${GITHUB_REF_NAME}"
          max_attempts=80
          sleep_seconds=15

          tests_workflow_id=""
          tests_workflow_path=".forgejo/workflows/tests.yml"

          workflows_response="$(curl -fsSL \
            -H "Authorization: token ${token}" \
            -H "Accept: application/json" \
            "${api_url}/repos/${repo}/actions/workflows?limit=100")"

          tests_workflow_id="$(printf '%s' "$workflows_response" | jq -r --arg path "$tests_workflow_path" '
            ((.workflows // .data // [])
              | map(select((.name // "") == "Tests" or ((.path // .file_name // "") | endswith($path))))
              | sort_by(.id // 0)
              | last
              | .id) // empty
          ')"

          if [ -n "$tests_workflow_id" ]; then
            echo "Resolved Tests workflow id=${tests_workflow_id}."
          else
            echo "Could not resolve Tests workflow id from workflows API; using runs list fallback."
          fi

          echo "Waiting for Tests workflow to complete for sha=${sha} ref=${ref_name}"

          for attempt in $(seq 1 "$max_attempts"); do
            if [ -n "$tests_workflow_id" ]; then
              response="$(curl -fsSL \
                -H "Authorization: token ${token}" \
                -H "Accept: application/json" \
                "${api_url}/repos/${repo}/actions/workflows/${tests_workflow_id}/runs?branch=${ref_name}&event=push&limit=50")"
            else
              response="$(curl -fsSL \
                -H "Authorization: token ${token}" \
                -H "Accept: application/json" \
                "${api_url}/repos/${repo}/actions/runs?limit=100")"
            fi

            run_json="$(printf '%s' "$response" | jq -c --arg sha "$sha" '
              ((.workflow_runs // .runs // .data // [])
                | map(select(
                    ((.head_sha // .head_commit.id // .head_commit.sha // .sha // "") == $sha)
                    and
                    (
                      ((.name // .workflow_name // "") == "Tests")
                      or
                      ((.path // .workflow_path // "") | endswith("/tests.yml"))
                    )
                  ))
                | sort_by(.id // .run_number // 0)
                | last) // empty
            ')"

            if [ -z "$run_json" ]; then
              echo "Attempt ${attempt}/${max_attempts}: no Tests run found yet for this SHA."
              sleep "$sleep_seconds"
              continue
            fi

            status="$(printf '%s' "$run_json" | jq -r '.status // .state // ""')"
            conclusion="$(printf '%s' "$run_json" | jq -r '.conclusion // .result // ""')"
            run_id="$(printf '%s' "$run_json" | jq -r '.id // "unknown"')"

            echo "Attempt ${attempt}/${max_attempts}: Tests run id=${run_id} status=${status} conclusion=${conclusion}"

            if [ "$status" = "completed" ] || [ "$status" = "success" ] || [ "$status" = "failure" ]; then
              if [ "$conclusion" = "success" ] || [ "$status" = "success" ]; then
                echo "Tests workflow passed for ${sha}."
                exit 0
              fi

              echo "Tests workflow did not pass for ${sha} (conclusion=${conclusion}, status=${status})." >&2
              exit 1
            fi

            sleep "$sleep_seconds"
          done

          echo "Timed out waiting for Tests workflow completion for ${sha}." >&2
          exit 1

      - name: Verify immutable tag source
        if: startsWith(github.ref, 'refs/tags/v')
        shell: sh
        run: |
          set -eu
          tag_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          if [ "$tag_commit" != "$GITHUB_SHA" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not resolve to ${GITHUB_SHA}" >&2
            exit 1
          fi

      - name: Verify tag version matches apps/kite package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: sh
        run: |
          set -eu
          tag_version="${GITHUB_REF_NAME#v}"
          app_package_path="apps/kite/package.json"

          if [ ! -f "$app_package_path" ]; then
            echo "Missing ${app_package_path}" >&2
            exit 1
          fi

          package_version="$(jq -r '.version // empty' "$app_package_path")"

          if [ -z "$package_version" ]; then
            echo "${app_package_path} is missing a version field" >&2
            exit 1
          fi

          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag version (${tag_version}) does not match ${app_package_path} version (${package_version})" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        shell: sh
        run: |
          set -eu
          docker buildx create --name release-builder --driver docker-container --use || docker buildx use release-builder
          docker buildx inspect --bootstrap

      - name: Resolve image coordinates
        id: coords
        shell: sh
        run: |
          set -eu

          registry="${REGISTRY_HOST:-}"
          if [ -z "$registry" ]; then
            registry="${GITHUB_SERVER_URL#https://}"
            registry="${registry#http://}"
          fi

          repo="${IMAGE_REPOSITORY:-$GITHUB_REPOSITORY}"
          repo="$(printf '%s' "$repo" | tr '[:upper:]' '[:lower:]')"

          image="${registry}/${repo}"
          cache_ref="${image}:buildcache"

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] || [ "${GITHUB_REF#refs/tags/}" != "${GITHUB_REF}" ]; then
            version_label="${GITHUB_REF_NAME}"
            primary_tag="${image}:${GITHUB_REF_NAME}"
            secondary_tag="${image}:latest"
            channel="release"
          else
            version_label="${NIGHTLY_GIT_TAG}"
            primary_tag="${image}:nightly"
            secondary_tag=""
            channel="nightly"
          fi

          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "cache_ref=$cache_ref" >> "$GITHUB_OUTPUT"
          echo "primary_tag=$primary_tag" >> "$GITHUB_OUTPUT"
          echo "secondary_tag=$secondary_tag" >> "$GITHUB_OUTPUT"
          echo "version_label=$version_label" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Update moving nightly Git tag
        if: steps.coords.outputs.channel == 'nightly'
        shell: bash
        run: |
          set -euo pipefail

          nightly_tag="${NIGHTLY_GIT_TAG}"
          if [ -z "$nightly_tag" ]; then
            echo "NIGHTLY_GIT_TAG must not be empty" >&2
            exit 1
          fi

          committer_name="${GIT_COMMITTER_NAME:-${GITHUB_ACTOR:-kite-ci}}"
          committer_email="${GIT_COMMITTER_EMAIL:-${committer_name}@users.codeguilds.org}"
          git config user.name "$committer_name"
          git config user.email "$committer_email"

          git tag -fa "$nightly_tag" -m "Nightly build ${GITHUB_SHA}" "$GITHUB_SHA"

          if [ -n "${GITHUB_TOKEN:-}" ]; then
            auth_header=( -c "http.extraHeader=Authorization: token ${GITHUB_TOKEN}" )
          else
            auth_header=()
          fi

          git "${auth_header[@]}" push origin "refs/tags/${nightly_tag}" --force

      - name: Log in to container registry
        shell: sh
        env:
          REGISTRY_USERNAME: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -eu
          username="${REGISTRY_USERNAME:-${GITHUB_REPOSITORY_OWNER}}"
          password="${REGISTRY_PASSWORD:-${RELEASE_TOKEN:-${GITHUB_TOKEN:-}}}"
          if [ -z "$password" ]; then
            echo "No container registry token available. Set CONTAINER_REGISTRY_PASSWORD or RELEASE_TOKEN with package write permission." >&2
            exit 1
          fi
          printf '%s' "$password" | docker login "${{ steps.coords.outputs.registry }}" -u "$username" --password-stdin

      - name: Build and push image
        id: build
        shell: bash
        run: |
          set -euo pipefail

          build_args=(
            --file ./apps/kite/Dockerfile
            --pull
            --push
            --attest type=provenance,mode=max
            --attest type=sbom
            --cache-from "type=registry,ref=${{ steps.coords.outputs.cache_ref }}"
            --cache-to "type=registry,ref=${{ steps.coords.outputs.cache_ref }},mode=max"
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL%/}/${GITHUB_REPOSITORY}"
            --label "org.opencontainers.image.revision=${GITHUB_SHA}"
            --label "org.opencontainers.image.version=${{ steps.coords.outputs.version_label }}"
            --tag "${{ steps.coords.outputs.primary_tag }}"
          )

          if [ -n "${{ steps.coords.outputs.secondary_tag }}" ]; then
            build_args+=(--tag "${{ steps.coords.outputs.secondary_tag }}")
          fi

          docker buildx build "${build_args[@]}" --metadata-file ./build-metadata.json .

          digest="$(jq -r '."containerimage.digest" // ."containerimage.descriptor".digest // empty' ./build-metadata.json)"
          if [ -z "$digest" ]; then
            echo "Unable to determine image digest from build metadata" >&2
            exit 1
          fi

          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail

          channel="${{ steps.coords.outputs.channel }}"
          current_tag="${{ steps.coords.outputs.version_label }}"
          previous_tag=""

          if [ "$channel" = "release" ]; then
            previous_tag="$(git tag --list 'v*' --sort=-version:refname | grep -vx "$current_tag" | head -n1 || true)"
          fi

          {
            echo "*Beep boop, I'm a bot! This release was auto generated by the release workflow. As such, the information below was auto generated.*"
            echo
            if [ "$channel" = "nightly" ]; then
              echo "## Nightly build"
              echo
              echo "- Branch: \`${GITHUB_REF_NAME}\`"
              echo "- Commit: \`${GITHUB_SHA}\`"
              echo
            fi

            echo "## Container"
            echo
            echo "- Image: \`${{ steps.coords.outputs.image }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Published tags:"
            echo "  - \`${{ steps.coords.outputs.primary_tag }}\`"
            if [ -n "${{ steps.coords.outputs.secondary_tag }}" ]; then
              echo "  - \`${{ steps.coords.outputs.secondary_tag }}\`"
            fi
            echo
            if [ -n "$previous_tag" ]; then
              echo "## Changes since $previous_tag"
              echo
              git log --no-merges --reverse --pretty='- %s (%h) - @%an' "$previous_tag..$current_tag"
            elif [ "$channel" = "nightly" ]; then
              echo "## Changes from the last 24 hours"
              echo
              git log --no-merges --reverse --since='24 hours ago' --pretty='- %s (%h) - @%an' "$GITHUB_SHA"
            else
              echo "## Changes"
              echo
              git log --no-merges --reverse --pretty='- %s (%h) - @%an' "$current_tag"
            fi
          } > RELEASE_NOTES.md

      - name: Publish release
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail

          api_url="${FORGEJO_API_URL:-${GITHUB_API_URL:-${GITHUB_SERVER_URL%/}/api/v1}}"
          token="${RELEASE_TOKEN:-${GITHUB_TOKEN:-}}"
          if [ -z "$token" ]; then
            echo "No release token available. Set RELEASE_TOKEN or ensure GITHUB_TOKEN is present." >&2
            exit 1
          fi

          channel="${{ steps.coords.outputs.channel }}"
          tag="${{ steps.coords.outputs.version_label }}"

          if [ "$channel" = "nightly" ]; then
            release_name="Nightly ${tag}"
            prerelease=true
          else
            release_name="Release ${tag}"
            prerelease=false
          fi

          body="$(cat RELEASE_NOTES.md)"
          repo="${GITHUB_REPOSITORY}"

          existing_id="$(curl -fsSL \
            -H "Authorization: token ${token}" \
            -H "Accept: application/json" \
            "${api_url}/repos/${repo}/releases/tags/${tag}" | jq -r '.id // empty' || true)"

          payload="$(jq -n \
            --arg tag_name "$tag" \
            --arg name "$release_name" \
            --arg body "$body" \
            --argjson prerelease "$prerelease" \
            '{tag_name: $tag_name, name: $name, body: $body, draft: false, prerelease: $prerelease}')"

          if [ -n "$existing_id" ]; then
            curl -fsSL -X PATCH \
              -H "Authorization: token ${token}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "${api_url}/repos/${repo}/releases/${existing_id}" >/dev/null
          else
            curl -fsSL -X POST \
              -H "Authorization: token ${token}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "${api_url}/repos/${repo}/releases" >/dev/null
          fi
