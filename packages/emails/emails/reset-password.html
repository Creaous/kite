<!--
Reset password email template placeholders:
{{recipientName}}, {{brandingName}}, {{actionUrl}}, {{year}}, {{logoSrc}}
-->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reset password</title>
    <style>
      body {
        font-family:
          Inter,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial;
        background: #f1f5f9;
        margin: 0;
        padding: 24px;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 12px;
        padding: 28px;
        box-shadow: 0 8px 30px rgba(2, 6, 23, 0.08);
      }
      .header {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .logo {
        width: 56px;
        height: auto;
      }
      h1 {
        margin: 18px 0 6px 0;
        font-size: 20px;
        color: #0f172a;
      }
      p.lead {
        margin: 0 0 18px 0;
        color: #475569;
      }
      .btn {
        display: inline-block;
        background: #0ea5a4;
        color: white;
        text-decoration: none;
        padding: 10px 16px;
        border-radius: 8px;
        font-weight: 600;
      }
      .muted {
        color: #64748b;
        font-size: 13px;
      }
      .footer {
        margin-top: 22px;
        font-size: 13px;
        color: #94a3b8;
      }
      .divider {
        height: 1px;
        background: #e6edf3;
        margin: 18px 0;
        border-radius: 1px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <img src="{{logoSrc}}" alt="{{brandingName}}" class="logo" />
        <div>
          <div class="muted">{{brandingName}}</div>
          <div class="muted">Account security</div>
        </div>
      </div>

      <h1>Reset your password</h1>
      <p class="lead">Hi {{recipientName}},</p>

      <p class="muted">
        We received a request to reset the password for your account.
      </p>

      <div style="text-align: left; margin-top: 14px">
        <a class="btn" href="{{actionUrl}}">Reset password</a>
      </div>

      <div class="divider"></div>

      <div class="footer">
        <div>If you did not request this, you can safely ignore this email.</div>
        <div style="margin-top: 6px">&copy; {{year}} {{brandingName}}</div>
      </div>
    </div>
  </body>
</html>
